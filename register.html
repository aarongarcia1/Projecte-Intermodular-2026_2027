<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Altercom21</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">ALTERCOM<span>21</span></a><nav><a href="index.html">Inicio</a><a href="login.html">Iniciar sesión</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="eyebrow">NUEVA CUENTA</div><h1>Crear cuenta</h1><p class="muted">Regístrate para solicitar servicios y seguirlos.</p>
<form id="register-form"><label>Nombre completo<input name="full_name" autocomplete="name" required maxlength="120"></label><label>Empresa (opcional)<input name="company" autocomplete="organization" maxlength="160"></label><label>Teléfono (opcional)<input name="phone" autocomplete="tel" maxlength="40"></label><label>Correo electrónico<input type="email" name="email" autocomplete="email" required></label><label>Contraseña<input type="password" name="password" autocomplete="new-password" required minlength="8"><small>Usa al menos 8 caracteres.</small></label><button class="btn primary full" type="submit">Crear cuenta</button><p id="message" class="message" aria-live="polite"></p></form><div class="auth-links"><span>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></span></div></section></main><script type="module" src="assets/js/register.js"></script></body></html>
