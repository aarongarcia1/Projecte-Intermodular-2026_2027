
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración | Altercom21</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">ALTERCOM<span>21</span></a>
    <nav>
      <a href="dashboard.html">Portal</a>
      <button class="nav-button" id="logout">Cerrar sesión</button>
    </nav>
  </header>

  <main class="page">
    <div class="page-heading">
      <div>
        <div class="eyebrow">GESTIÓN INTERNA</div>
        <h1>Panel de administración</h1>
        <p class="muted">Gestiona clientes, solicitudes y presupuestos.</p>
      </div>
      <button id="refresh" class="btn secondary">Actualizar solicitudes</button>
    </div>

    <section class="panel">
      <div id="admin-message" class="message" aria-live="polite"></div>

      <h2>Usuarios registrados</h2>
      <p class="muted">Consulta los perfiles de los clientes registrados.</p>
      <button id="refresh-users" class="btn secondary" type="button">
        Actualizar usuarios
      </button>
      <div id="admin-users" aria-live="polite">
        <p class="muted">Cargando usuarios…</p>
      </div>
    </section>

    <section class="panel">
      <h2>Solicitudes y presupuestos</h2>
      <div id="admin-requests">
        <p class="muted">Cargando solicitudes…</p>
      </div>
    </section>
  </main>

  <footer>© Altercom21 · Administración</footer>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
